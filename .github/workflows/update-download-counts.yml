name: Update download counts

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-download-counts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Calculate plugin download counts
        id: counts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          crescent_total="$({
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("CrescentCompass-v")) | .assets[] | select(.name == "CrescentCompass.zip") | .download_count'
          } | awk '{ sum += $1 } END { print sum + 0 }')"

          avarice_total="$({
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("AvariceCN-v")) | .assets[] | select(.name == "AvariceCN.zip") | .download_count'
          } | awk '{ sum += $1 } END { print sum + 0 }')"

          CRESCENT_TOTAL="$crescent_total" AVARICE_TOTAL="$avarice_total" python3 - <<'PY'
          import datetime
          import json
          import os
          import re

          path = "stats/downloads.json"
          with open(path, encoding="utf-8") as stream:
              data = json.load(stream)

          totals = {
              "CrescentCompass": int(os.environ["CRESCENT_TOTAL"]),
              "AvariceCN": int(os.environ["AVARICE_TOTAL"]),
          }
          changed = False
          updated_at = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          for internal_name, total in totals.items():
              entry = data[internal_name]
              if entry["downloadCount"] != total:
                  entry["downloadCount"] = total
                  entry["updatedAt"] = updated_at
                  changed = True

          if changed:
              with open(path, "w", encoding="utf-8", newline="\n") as stream:
                  json.dump(data, stream, ensure_ascii=False, indent=2)
                  stream.write("\n")

          readme_path = "README.md"
          with open(readme_path, encoding="utf-8") as stream:
              readme = stream.read()

          updated_readme = readme
          for internal_name, total in totals.items():
              pattern = re.compile(rf"(<!-- download-count:{internal_name} -->)\d+(<!-- /download-count:{internal_name} -->)")
              updated_readme, replacements = pattern.subn(rf"\g<1>{total}\g<2>", updated_readme)
              if replacements != 1:
                  raise RuntimeError(f"README download-count marker for {internal_name} is missing or duplicated")
          if updated_readme != readme:
              changed = True
              with open(readme_path, "w", encoding="utf-8", newline="\n") as stream:
                  stream.write(updated_readme)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"changed={str(changed).lower()}\n")
          PY

      - name: Commit updated counts
        if: steps.counts.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md stats/downloads.json
          git commit -m "更新插件累计下载量"
          git push
