name: Update download counts

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-download-counts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Calculate plugin download counts
        id: counts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          total="$({
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("CrescentCompass-v")) | .assets[] | select(.name == "CrescentCompass.zip") | .download_count'
          } | awk '{ sum += $1 } END { print sum + 0 }')"

          current="$(python3 -c 'import json; print(json.load(open("stats/downloads.json", encoding="utf-8"))["CrescentCompass"]["downloadCount"])')"
          if [[ "$total" == "$current" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL="$total" python3 - <<'PY'
          import datetime
          import json
          import os

          path = "stats/downloads.json"
          with open(path, encoding="utf-8") as stream:
              data = json.load(stream)

          entry = data["CrescentCompass"]
          entry["downloadCount"] = int(os.environ["TOTAL"])
          entry["updatedAt"] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          with open(path, "w", encoding="utf-8", newline="\n") as stream:
              json.dump(data, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated counts
        if: steps.counts.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/downloads.json
          git commit -m "更新插件累计下载量"
          git push
