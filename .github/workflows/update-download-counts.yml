name: Update download counts

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-download-counts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Calculate plugin download counts
        id: counts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          total="$({
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("CrescentCompass-v")) | .assets[] | select(.name == "CrescentCompass.zip") | .download_count'
          } | awk '{ sum += $1 } END { print sum + 0 }')"

          TOTAL="$total" python3 - <<'PY'
          import datetime
          import json
          import os
          import re

          path = "stats/downloads.json"
          with open(path, encoding="utf-8") as stream:
              data = json.load(stream)

          entry = data["CrescentCompass"]
          total = int(os.environ["TOTAL"])
          changed = entry["downloadCount"] != total
          if changed:
              entry["downloadCount"] = total
              entry["updatedAt"] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

              with open(path, "w", encoding="utf-8", newline="\n") as stream:
                  json.dump(data, stream, ensure_ascii=False, indent=2)
                  stream.write("\n")

          readme_path = "README.md"
          with open(readme_path, encoding="utf-8") as stream:
              readme = stream.read()

          pattern = re.compile(r"(<!-- download-count:CrescentCompass -->)\d+(<!-- /download-count:CrescentCompass -->)")
          updated_readme, replacements = pattern.subn(rf"\g<1>{total}\g<2>", readme)
          if replacements != 1:
              raise RuntimeError("README download-count marker is missing or duplicated")
          if updated_readme != readme:
              changed = True
              with open(readme_path, "w", encoding="utf-8", newline="\n") as stream:
                  stream.write(updated_readme)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"changed={str(changed).lower()}\n")
          PY

      - name: Commit updated counts
        if: steps.counts.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md stats/downloads.json
          git commit -m "更新插件累计下载量"
          git push
